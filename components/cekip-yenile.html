<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çekip Yenile</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px} .card{width:260px;padding:30px 20px;text-align:center;border:1px solid #a3f0f044;border-radius:22px;background:#ffffff0c;touch-action:pan-y;user-select:none;transition:transform .2s}.arrow{font-size:25px;color:#a3f0f0;margin-bottom:12px}.card small{color:#9dbbbb}</style><div class='card'><div class='arrow'>↓</div><strong>Yenilemek için çek</strong><small>Kartı aşağı sürükle</small></div><script>const c=document.querySelector('.card'),a=document.querySelector('.arrow'),h=document.querySelector('small');let y=null,d=0;c.onpointerdown=e=>{y=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(y===null)return;d=Math.max(0,Math.min(90,e.clientY-y));c.style.transform='translateY('+d*.35+'px)';h.textContent=d>65?'Bırak ve yenile':'Biraz daha çek'};function end(){if(y===null)return;if(d>65){h.textContent='Yenilendi ✓';a.textContent='✓'}else h.textContent='Kartı aşağı sürükle';y=null;d=0;c.style.transform='';setTimeout(()=>a.textContent='↓',1300)}c.onpointerup=end;c.onpointercancel=end;</script></html>
