<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yumuşak Seçimler</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px} .choices{display:grid;gap:10px;width:260px}button{padding:14px;border:1px solid #a3f0f033;border-radius:14px;background:#ffffff09;color:#e6f2f2;text-align:left;cursor:pointer;transition:.2s}button[aria-pressed=true]{border-color:#a3f0f0;background:#8de9e91a;box-shadow:0 0 22px #6ce3df20}</style><div class='choices'><button aria-pressed='true'>Saf cam</button><button aria-pressed='false'>Buzlu cam</button><button aria-pressed='false'>Yumuşak ışık</button></div><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))));</script></html>
