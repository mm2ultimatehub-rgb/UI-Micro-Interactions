<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yükleme Düğmesi</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px}button{padding:14px 22px;border:1px solid #b8ffff55;border-radius:15px;background:linear-gradient(135deg,#b8ffff30,#65c6c522);color:#eaffff;font:600 14px system-ui;cursor:pointer;backdrop-filter:blur(16px);min-width:170px}button:disabled{opacity:.7;cursor:wait}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:white;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style><button id='go'>İşlemi başlat</button><script>const b=document.querySelector('button');b.onclick=()=>{b.disabled=true;b.innerHTML='<i class=spin></i>Yükleniyor';setTimeout(()=>{b.disabled=false;b.textContent='Tamamlandı ✓';setTimeout(()=>b.textContent='Tekrar dene',1400)},1800)};</script></html>
