<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sıvı Slider</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px}section{width:260px;padding:24px;border:1px solid #a3f0f044;border-radius:20px;background:#ffffff0b;backdrop-filter:blur(15px)}.top{display:flex;justify-content:space-between;margin-bottom:20px;color:#bde7e7}b{font-size:24px;color:#a3f0f0}input{width:100%;accent-color:#8ce3dc}small{display:block;margin-top:12px;color:#8eb4b4}</style><section><div class='top'>Yoğunluk <b>64%</b></div><input type='range' min='0' max='100' value='64'><small>Sürükleyerek ayarla</small></section><script>const r=document.querySelector('input'),v=document.querySelector('b');r.oninput=()=>v.textContent=r.value+'%';</script></html>
