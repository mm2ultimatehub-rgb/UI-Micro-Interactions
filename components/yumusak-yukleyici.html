<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yumuşak Yükleyici</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px}.orb{width:86px;height:86px;border:2px solid #a3f0f055;border-top-color:#a3f0f0;border-radius:50%;box-shadow:0 0 32px #a3f0f055;animation:spin 1.1s ease-in-out infinite;margin:auto}.orb:after{content:'';display:block;position:absolute;inset:15px;border-radius:50%;background:#a3f0f022;animation:pulse 1.4s infinite}p{font-size:10px;letter-spacing:.2em;color:#a3f0f0;margin-top:24px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(.6);opacity:.3}}</style><div class='orb'></div><p>YÜKLENİYOR</p><script></script></html>
