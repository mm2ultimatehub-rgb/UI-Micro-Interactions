<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yumuşak Anahtar</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px}.switch{width:76px;height:42px;padding:4px;border:1px solid #a3f0f055;border-radius:30px;background:#ffffff0d;cursor:pointer;transition:.3s}.switch i{display:block;width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#efffff,#8abfc0);transition:.3s}.switch[aria-checked=true]{background:#55c7b855;box-shadow:0 0 25px #71e3d544}.switch[aria-checked=true] i{transform:translateX(34px);background:#8ff3d8}p{color:#bde7e7}</style><button class='switch' role='switch' aria-checked='false'><i></i></button><p id='state'>Kapalı</p><script>const b=document.querySelector('button'),s=document.querySelector('#state');b.onclick=()=>{let on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);s.textContent=on?'Açık':'Kapalı'};</script></html>
