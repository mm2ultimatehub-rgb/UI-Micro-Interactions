<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akan Sekmeler</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px} .tabs{display:flex;position:relative;padding:5px;border:1px solid #a3f0f033;border-radius:16px;background:#ffffff0a}.tabs button{z-index:1;padding:11px 14px;border:0;background:none;color:#b6d0d0;cursor:pointer}.indicator{position:absolute;top:5px;bottom:5px;left:5px;width:75px;border-radius:12px;background:#9ff5ef33;border:1px solid #a3f0f044;transition:all .35s cubic-bezier(.2,.8,.2,1)}</style><div class='tabs'><i class='indicator'></i><button>Genel</button><button>Keşfet</button><button>Kaydedilen</button></div><script>const bs=[...document.querySelectorAll('button')],i=document.querySelector('.indicator');function move(b){bs.forEach(x=>x.style.color=x===b?'#eaffff':'#b6d0d0');i.style.width=b.offsetWidth+'px';i.style.transform='translateX('+(b.offsetLeft-5)+'px')}bs.forEach(b=>b.onclick=()=>move(b));window.onresize=()=>move(bs.find(b=>b.style.color==='rgb(234, 255, 255)')||bs[0]);</script></html>
