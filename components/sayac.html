<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sayaç</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;background:radial-gradient(circle,#18383b,#091315 72%);font:14px Inter,system-ui;color:#e6f2f2;position:relative}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #a3f0f0;outline-offset:4px} .counter{display:flex;align-items:center;gap:22px;padding:18px;border:1px solid #a3f0f033;border-radius:22px;background:#ffffff0a}button{width:42px;height:42px;border:1px solid #a3f0f055;border-radius:14px;background:#a3f0f018;color:#cfffff;font-size:22px;cursor:pointer}output{min-width:36px;text-align:center;font-size:28px;color:#a3f0f0}</style><div class='counter'><button aria-label='Azalt'>−</button><output>0</output><button aria-label='Artır'>+</button></div><script>let n=0;const o=document.querySelector('output'),b=document.querySelectorAll('button');b[0].onclick=()=>o.textContent=--n;b[1].onclick=()=>o.textContent=++n;</script></html>
