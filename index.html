<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1214"><title>Micro Motion — UI Mikro-Etkileşim Galerisi</title><link rel="icon" href="assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b1214;--text:#e6f2f2;--muted:#8fa9aa;--accent:#a3f0f0;--line:#a3f0f022}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#1a454633,transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui}.shell{width:min(1160px,calc(100% - 36px));margin:auto}header{padding:24px 0;border-bottom:1px solid var(--line)}.brand{font:700 18px 'Space Grotesk';letter-spacing:-.04em}.brand b{color:var(--accent)}.hero{padding:70px 0 42px;max-width:750px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.15em;text-transform:uppercase}h1,h2,h3{font-family:'Space Grotesk';letter-spacing:-.04em}h1{font-size:clamp(42px,7vw,70px);line-height:1.02;margin:18px 0}h1 span{color:var(--accent)}.hero p{color:var(--muted);line-height:1.7;max-width:600px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 0;border-top:1px solid var(--line)}input[type=search]{width:min(360px,100%);padding:12px 15px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;color:var(--text)}.filters{display:flex;gap:7px;flex-wrap:wrap}.chip,.action{border:1px solid var(--line);border-radius:30px;background:#ffffff07;color:var(--muted);padding:9px 12px;font-size:11px;cursor:pointer}.chip.active,.chip:hover,.action:hover{border-color:#a3f0f077;color:var(--accent);background:#a3f0f012}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.sectionhead h2{font-size:20px}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:70px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#ffffff0b,#ffffff04);transition:.25s}.card:hover{transform:translateY(-4px);border-color:#a3f0f055;box-shadow:0 20px 45px #0004}.preview{height:190px;background:#0c1719;cursor:pointer}.preview iframe{width:100%;height:100%;border:0;pointer-events:none}.cardbody{padding:16px}.card h3{margin:0;font-size:17px}.desc{font-size:12px;line-height:1.6;color:var(--muted);min-height:38px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:10px;color:#a6c3c3;border:1px solid var(--line);padding:5px 8px;border-radius:20px}.actions{display:flex;gap:7px;margin-top:14px}.action{flex:1;border-radius:9px}.action.primary{color:var(--accent);border-color:#a3f0f044}.empty{grid-column:1/-1;text-align:center;padding:45px;border:1px dashed var(--line);color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px 0 32px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap}a{color:var(--accent)}dialog{width:min(1000px,calc(100% - 20px));height:90vh;border:1px solid #a3f0f055;border-radius:18px;background:#0d191b;color:var(--text);padding:0}dialog::backdrop{background:#020809d9;backdrop-filter:blur(8px)}.modalhead{height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--line);gap:8px}.modalhead strong{font:600 14px 'Space Grotesk'}.modalhead button{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#ffffff08;color:var(--text);font-size:11px}.modalstage{height:calc(100% - 58px);padding:12px;display:grid;place-items:center}.modalstage iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px}.modalstage.mobile iframe{width:390px;max-width:100%}.close{font-size:18px!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.hero{padding:48px 0 28px}h1{font-size:45px}.grid{grid-template-columns:1fr}.preview{height:200px}.toolbar{align-items:stretch}.filters{overflow:auto;flex-wrap:nowrap}.chip{white-space:nowrap}.modalhead{flex-wrap:wrap;height:auto}.modalstage{height:calc(100% - 95px)}}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}</style></head><body><header><div class="shell brand">✳ MICRO <b>MOTION</b></div></header><main class="shell"><section class="hero"><div class="eyebrow">● 09 ETKİLEŞİM · SAF HTML</div><h1>Küçük hareketler.<br><span>Büyük hisler.</span></h1><p>Arayüzlere karakter katan mikro-etkileşimleri keşfet. Canlı önizle, kodunu kopyala ve kendi projene ekle.</p></section><section class="toolbar"><input id="search" type="search" placeholder="Bileşen ara…" aria-label="Bileşen ara"><div class="filters" id="filters"><button class="chip active" data-tag="all">Tümü</button></div></section><div class="sectionhead"><h2>Bileşen koleksiyonu</h2><span class="count" id="count"></span></div><section class="grid" id="grid"><div class="empty">Katalog yükleniyor…</div></section></main><footer class="shell"><span>© 2026 Micro Motion · MIT</span><a href="https://github.com/mm2ultimatehub-rgb/UI-Micro-Interactions">GitHub deposu ↗</a></footer><dialog id="modal"><div class="modalhead"><strong id="modalTitle">Önizleme</strong><div><button id="desktop">Masaüstü</button> <button id="mobile">Mobil</button> <button id="copyModal">Kodu kopyala</button> <button class="close" id="close">×</button></div></div><div class="modalstage" id="stage"><iframe id="frame" title="Tam ekran bileşen önizlemesi"></iframe></div></dialog><script>
const $=s=>document.querySelector(s),grid=$('#grid'),modal=$('#modal'),stage=$('#stage');let items=[],tag='all',selected=null;const cache={};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function code(x){return cache[x.file]||(cache[x.file]=await(await fetch('components/'+encodeURIComponent(x.file))).text())}function render(){let q=$('#search').value.toLocaleLowerCase('tr');let a=items.filter(x=>(tag==='all'||x.tags.includes(tag))&&[x.name,x.description,...x.tags].join(' ').toLocaleLowerCase('tr').includes(q));$('#count').textContent=a.length+' / '+items.length+' bileşen';grid.innerHTML=a.length?a.map((x)=>'<article class="card"><div class="preview" data-open="'+x.id+'"><iframe loading="lazy" title="'+esc(x.name)+' önizleme" src="components/'+encodeURIComponent(x.file)+'"></iframe></div><div class="cardbody"><h3>'+esc(x.name)+'</h3><p class="desc">'+esc(x.description)+'</p><div class="tags">'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><div class="actions"><button class="action primary" data-open="'+x.id+'">Önizle ↗</button><button class="action" data-copy="'+x.id+'">Kodu kopyala</button><button class="action" data-download="'+x.id+'">İndir ↓</button></div></div></article>').join(''):'<div class="empty">Aramana uygun bileşen bulunamadı.</div>'}function open(x){selected=x;$('#modalTitle').textContent=x.name;$('#frame').src='components/'+encodeURIComponent(x.file);stage.classList.remove('mobile');modal.showModal()}$('#search').oninput=render;$('#filters').onclick=e=>{let b=e.target.closest('[data-tag]');if(!b)return;tag=b.dataset.tag;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()};grid.onclick=async e=>{let o=e.target.closest('[data-open]'),c=e.target.closest('[data-copy]'),d=e.target.closest('[data-download]');if(o)open(items.find(x=>x.id===o.dataset.open));if(c){try{await navigator.clipboard.writeText(await code(items.find(x=>x.id===c.dataset.copy)));c.textContent='Kopyalandı ✓'}catch{c.textContent='Hata'}}if(d){let x=items.find(x=>x.id===d.dataset.download),u=URL.createObjectURL(new Blob([await code(x)],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download=x.file;a.click();URL.revokeObjectURL(u)}};$('#close').onclick=()=>modal.close();$('#desktop').onclick=()=>stage.classList.remove('mobile');$('#mobile').onclick=()=>stage.classList.add('mobile');$('#copyModal').onclick=async()=>{try{await navigator.clipboard.writeText(await code(selected));$('#copyModal').textContent='Kopyalandı ✓'}catch{}};(async()=>{try{items=await(await fetch('components.json')).json();let tags=[...new Set(items.flatMap(x=>x.tags))].sort((a,b)=>a.localeCompare(b,'tr'));$('#filters').insertAdjacentHTML('beforeend',tags.map(t=>'<button class="chip" data-tag="'+esc(t)+'">'+esc(t)+'</button>').join(''));render()}catch{$('#count').textContent='Katalog yüklenemedi'}})();</script></body></html>
